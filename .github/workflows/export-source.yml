name: Export source archive
on:
  push:
    paths:
      - '.github/workflows/export-source.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: zip -r source.zip . -x '.git/*' 'source.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: zyvo-netlify-source
          path: source.zip
          retention-days: 1
